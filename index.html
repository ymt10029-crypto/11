<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commercial Document Scanner</title>
<script src="https://docs.opencv.org/4.x/opencv.js"></script>
<style>
body{margin:0;font-family:Arial;background:#0b0f14;color:#fff}
#app{display:flex;flex-direction:column;height:100vh}
header{padding:10px;background:#0f172a;text-align:center;font-weight:bold}
#viewer{flex:1;position:relative;background:#000}
video,canvas{width:100%;height:100%;object-fit:cover}
#controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;background:#020617}
button{padding:12px;border:none;border-radius:6px;font-weight:bold}
.start{background:#16a34a;color:#fff}
.scan{background:#dc2626;color:#fff}
.mode{background:#1e293b;color:#fff}
.download{background:#2563eb;color:#fff}
</style>
</head>
<body>
<div id="app">
<header>📄 商用文件掃描器 Commercial Scanner</header>
<div id="viewer">
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
</div>
<div id="controls">
<button class="start" onclick="startCamera()">啟動相機</button>
<button class="scan" onclick="scan()">掃描</button>
<button class="mode" onclick="setMode('color')">彩色</button>
<button class="mode" onclick="setMode('gray')">黑白</button>
<button class="mode" onclick="setMode('enhance')">增強</button>
<button class="download" onclick="download()">下載</button>
</div>
</div>

<script>
let video=document.getElementById('video');
let canvas=document.getElementById('canvas');
let ctx=canvas.getContext('2d');
let stream=null;
let mode='color';
let cvReady=false;

cv['onRuntimeInitialized']=()=>{cvReady=true;console.log('OpenCV Ready')}

function startCamera(){
 navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>{
  stream=s;video.srcObject=s;
  setTimeout(()=>{
   canvas.width=video.videoWidth;
   canvas.height=video.videoHeight;
  },500);
 })
}

function setMode(m){mode=m}

function scan(){
 if(!cvReady){alert('OpenCV尚未準備完成');return}
 ctx.drawImage(video,0,0,canvas.width,canvas.height);
 let src=cv.imread(canvas);
 let output=src.clone();

 if(mode==='gray'){
  let g=new cv.Mat();let bin=new cv.Mat();
  cv.cvtColor(src,g,cv.COLOR_RGBA2GRAY);
  cv.adaptiveThreshold(g,bin,255,cv.ADAPTIVE_THRESH_GAUSSIAN_C,cv.THRESH_BINARY,15,10);
  cv.imshow(canvas,bin);
  g.delete();bin.delete();
 }
 else if(mode==='enhance'){
  let e=new cv.Mat();
  src.convertTo(e,-1,1.4,20);
  cv.imshow(canvas,e);
  e.delete();
 }
 else{
  cv.imshow(canvas,src);
 }
 src.delete();output.delete();
}

function download(){
 let a=document.createElement('a');
 a.download='scan_'+Date.now()+'.png';
 a.href=canvas.toDataURL('image/png');
 a.click();
}
</script>
</body>
</html>
